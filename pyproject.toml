[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "jarvis-agent"
version = "0.1.0"
description = "Jarvis desktop and terminal AI agent"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "httpx>=0.27,<1", "typer>=0.12,<1", "rich>=13,<15", "pyyaml>=6,<7"]
[project.scripts]
jarvis = "local_agent.cli:app"
[tool.setuptools.packages.find]
include = ["local_agent*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
