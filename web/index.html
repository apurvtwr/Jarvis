<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jarvis</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark;background:#10141c;color:#e7eaf0}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{background:#2a3446;border:1px solid #44516a;color:#f0f3f9;padding:9px 12px;border-radius:8px;cursor:pointer}button:hover{background:#36445d}input,textarea,select{background:#171e2b;border:1px solid #3d4a60;color:#f4f5f8;padding:10px;border-radius:8px}aside{width:265px;flex-shrink:0;background:#151b26;border-right:1px solid #303a4d;padding:16px;height:100vh;overflow:auto}main{flex:1;min-width:0;height:100vh;display:flex;flex-direction:column}.layout{display:flex}.brand{font-size:19px;font-weight:700;margin:0 0 20px}.chat-link{display:block;width:100%;text-align:left;margin:6px 0;background:transparent;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chat-link.active{background:#314263}header{border-bottom:1px solid #303a4d;padding:12px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}#messages{flex:1;overflow:auto;padding:25px;max-width:100%;width:100%}.message{max-width:900px;margin:0 auto 18px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;padding:16px;border-radius:12px;background:#1c2534}.message.user{background:#263653}.meta{font-size:12px;color:#9eaac0;margin-bottom:7px}footer{padding:16px;border-top:1px solid #303a4d;display:flex;gap:8px}textarea{flex:1;resize:vertical;min-height:55px;max-height:180px}#folders{font-size:12px;color:#b7c5d8;max-width:600px;overflow-wrap:anywhere}#approval{display:none;background:#30281f;border:1px solid #886239;padding:16px;margin:10px 24px;border-radius:12px}#approval pre{white-space:pre-wrap;max-height:160px;overflow:auto}.muted{color:#9eaac0;font-size:13px}.primary{background:#3156a6}#status{padding:0 18px;color:#9eaac0;font-size:12px}@media(max-width:650px){aside{width:145px;padding:8px}header{padding:8px}#messages{padding:8px}}
</style></head><body><div class="layout"><aside><div class="brand">◆ Jarvis</div><button class="primary" onclick="newChat()">+ New chat</button><p class="muted">Shared with terminal</p><div id="chats"></div></aside><main><header><strong id="title">Select a conversation</strong><select id="model"><option value="auto">Auto router</option></select><button onclick="grantFolder()">+ Grant folder</button><span id="folders"></span></header><section id="messages"></section><section id="approval"><strong>Permission required</strong><p id="approval-title"></p><pre id="approval-args"></pre><button onclick="resolveApproval(true)">Approve once</button><button onclick="resolveApproval(false)">Deny</button></section><div id="status"></div><footer><textarea id="prompt" placeholder="Ask anything, or give the agent a task... (Enter to send, Shift+Enter for newline)"></textarea><button class="primary" onclick="send()">Send</button></footer></main></div>
<script>
let current=null, pending=null, busy=false;
const $=id=>document.getElementById(id);
async function api(path,method='GET',data){let r=await fetch('/api'+path,{method,headers:{'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});let obj=await r.json();if(!r.ok)throw Error(obj.detail||'Request failed');return obj}
function el(tag,cls,text){let n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
async function refreshChats(){let list=await api('/chats');$('chats').replaceChildren();for(let c of list){let b=el('button','chat-link'+(c.id===current?' active':''),c.title);b.title=c.id;b.onclick=()=>openChat(c.id,c.title);$('chats').append(b)}}
async function newChat(){try{let c=await api('/chats','POST',{title:'New chat'});await openChat(c.id,'New chat')}catch(e){alert(e.message)}}
async function openChat(id,title){current=id;$('title').textContent=title;await refreshChats();await refreshDetail()}
async function refreshDetail(){if(!current)return;let d=await api('/chats/'+current);if($('model').value!==(d.conversation.model_override||'auto'))$('model').value=d.conversation.model_override||'auto';$('messages').replaceChildren();for(let m of d.messages){let box=el('article','message '+m.role);box.append(el('div','meta',m.role+(m.model?' · '+m.model:'')));box.append(el('div','',m.content));$('messages').append(box)}$('folders').textContent=d.folders.length?'Folders: '+d.folders.join(', '):'No folders granted';pending=d.pending;showApproval();$('messages').scrollTop=$('messages').scrollHeight}
function showApproval(){let box=$('approval');box.style.display=pending?'block':'none';if(pending){let args=JSON.parse(pending.arguments);$('approval-title').textContent=pending.tool;$('approval-args').textContent=JSON.stringify(args.args,null,2)}}
async function loadModels(){let data=await api('/config');let select=$('model');select.replaceChildren(new Option('Auto router','auto'));for(let m of data.available_models)select.add(new Option(m,m));}
$('model').addEventListener('change',async()=>{if(!current)return;try{await api('/chats/'+current+'/model','PUT',{model:$('model').value})}catch(e){alert(e.message)}});
async function grantFolder(){if(!current)return alert('Create a chat first');let path=prompt('Absolute folder path on this computer:');if(!path)return;try{await api('/chats/'+current+'/folders','POST',{path});await refreshDetail()}catch(e){alert(e.message)}}
async function send(){if(!current)return alert('Create a chat first');if(busy||pending)return alert('Resolve the pending approval first');let message=$('prompt').value.trim();if(!message)return;busy=true;$('status').textContent='Agent is working…';$('prompt').value='';let id=current;try{let r=await api('/chats/'+id+'/messages','POST',{message,model:$('model').value});if(id===current){await refreshDetail();if(r.status==='approval')$('status').textContent='Waiting for approval';else $('status').textContent='Completed with '+r.model}}catch(e){$('status').textContent='Error: '+e.message}finally{busy=false}}
async function resolveApproval(accept){if(!pending||busy)return;busy=true;$('status').textContent='Processing…';try{let r=await api('/chats/'+current+'/approvals/'+pending.id,'POST',{accept});await refreshDetail();$('status').textContent=r.status==='approval'?'Waiting for approval':'Completed'}catch(e){$('status').textContent='Error: '+e.message}finally{busy=false}}
$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
loadModels().then(()=>refreshChats()).then(async()=>{let chats=await api('/chats');if(chats.length)await openChat(chats[0].id,chats[0].title)}).catch(e=>$('status').textContent=e.message);
setInterval(()=>{if(current&&!busy)refreshDetail().catch(()=>{})},4000);
</script></body></html>
