<!doctype html>
<!-- JARVIS UI. Visual language is Tron: see docs/THEME.md. All styling lives in
     web/theme.css and all icons in web/icons.js — do not inline new colors or emoji. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS · Command Center</title>
<link rel="icon" type="image/svg+xml" href="/jarvis.svg">
<link rel="stylesheet" href="/web/theme.css">
</head>
<body>
<div class="layout">
  <aside>
    <div class="side-top">
      <div class="brand"><span class="atom" aria-hidden="true"><span class="orbit"></span><span class="orbit two"></span><span class="core"></span><span class="electron"></span><span class="electron two"></span></span><span class="brand-text">JARVIS</span></div>
      <button class="icon-btn ghost" data-icon="sidebar" data-tip="Toggle sidebar" onclick="toggleSidebar()"></button>
    </div>
    <div class="side-actions">
      <button class="icon-btn primary" data-icon="chat-plus" data-tip="New chat" onclick="newChat()"></button>
      <button class="icon-btn" data-icon="folder-plus" data-tip="New project" onclick="newProject()"></button>
    </div>
    <nav class="side-scroll" id="chats" aria-label="Projects and chats"></nav>
    <div class="side-bottom" id="system-status" data-tip="Backend status"><i class="pulse"></i><span>LOCAL AI SYSTEM · ONLINE</span></div>
  </aside>
  <main>
    <header>
      <div class="title-block">
        <div class="crumb" id="crumb"></div>
        <strong id="title">Command center</strong>
      </div>
      <label class="model-pick" data-tip="Model for this chat" data-icon="cpu" data-icon-size="16"><select id="model" aria-label="Conversation model"><option value="auto">Auto router</option></select></label>
      <div class="header-actions">
        <button class="icon-btn" data-icon="attach" data-tip="Attach files or folders" onclick="grantFolder()"></button>
        <button class="icon-btn" data-icon="pencil" data-tip="Rename chat" onclick="withCurrent(renameChat)"></button>
        <button class="icon-btn" data-icon="move" data-tip="Move to project" onclick="withCurrent(moveChat)"></button>
        <button class="icon-btn danger" data-icon="trash" data-tip="Delete chat" onclick="withCurrent(deleteChat)"></button>
      </div>
      <div id="folders"></div>
    </header>
    <section id="messages" aria-live="polite"></section>
    <section id="approval" aria-live="assertive">
      <div class="approval-head" data-icon="shield">Permission required</div>
      <p id="approval-title"></p>
      <pre id="approval-args"></pre>
      <div class="approval-actions">
        <button class="icon-btn danger lg" data-icon="close" data-tip="Deny" onclick="resolveApproval(false)"></button>
        <button class="icon-btn primary lg" data-icon="check" data-tip="Approve once" onclick="resolveApproval(true)"></button>
      </div>
    </section>
    <div id="status"></div>
    <footer>
      <textarea id="prompt" aria-label="Message" placeholder="Message Jarvis…  (Enter to send · Shift+Enter for newline)"></textarea>
      <button class="icon-btn primary lg" id="send" data-icon="send" data-tip="Send" onclick="send()"></button>
    </footer>
  </main>
</div>

<div id="dialog" class="dialog-backdrop" hidden role="presentation">
  <div class="dialog-panel" id="dialog-panel" role="dialog" aria-modal="true" aria-labelledby="dialog-heading">
    <div class="dialog-eyebrow" id="dialog-eyebrow"></div>
    <h2 id="dialog-heading"></h2>
    <p id="dialog-description"></p>
    <form id="dialog-form">
      <div id="dialog-body"></div>
      <p class="dialog-error" id="dialog-validation" aria-live="polite"></p>
      <div class="dialog-actions" id="dialog-actions"></div>
    </form>
  </div>
</div>
<div id="tooltip" role="tooltip"></div>

<script src="/web/icons.js"></script>
<script src="/web/app.js"></script>
</body>
</html>
